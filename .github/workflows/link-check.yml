name: Link check

# This repository is an index. The one thing that genuinely rots here is a
# link, so that is the one thing worth automating. Runs twice a year, in
# line with MAINTENANCE.md, plus on demand and whenever the pages change.

on:
  schedule:
    - cron: "0 9 1 3,9 *"   # 1 March and 1 September
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "index.html"
      - "docs/**"
      - "MAINTENANCE.md"

permissions:
  contents: read
  issues: write

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-concurrency 4
            --accept 200,206,429
            --exclude-mail
            README.md MAINTENANCE.md docs/**/*.md index.html
          fail: false

      - name: Open an issue if links are broken
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Broken links found"
          content-filepath: ./lychee/out.md
          labels: documentation
