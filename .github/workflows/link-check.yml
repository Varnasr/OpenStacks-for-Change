name: Link check

# This repository is an index. The one thing that genuinely rots here is a
# link, so that is the one thing worth automating. Runs twice a year, in
# line with MAINTENANCE.md, plus on demand and whenever the pages change.

on:
  schedule:
    - cron: "0 9 1 3,9 *"   # 1 March and 1 September
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "index.html"
      - "docs/**"
      - "MAINTENANCE.md"

permissions:
  contents: read
  issues: write

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-concurrency 4
            --accept 200,206,429
            README.md MAINTENANCE.md docs/**/*.md index.html
          fail: false

      # The check also runs on every push that touches the pages, and each
      # failing run used to open a fresh issue: 21 identical "Broken links
      # found" issues were open on 2026-10-19. Update the open one instead.
      - name: Find the open report, if there is one
        if: steps.lychee.outputs.exit_code != 0
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label documentation \
                --search 'in:title "Broken links found"' --json number --jq '.[0].number // empty')
          echo "number=$n" >> "$GITHUB_OUTPUT"

      - name: Open or update the issue if links are broken
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: "Broken links found"
          issue-number: ${{ steps.existing.outputs.number }}
          content-filepath: ./lychee/out.md
          labels: documentation
