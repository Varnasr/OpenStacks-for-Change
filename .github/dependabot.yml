# Monthly, with minor and patch updates grouped into one pull request per
# ecosystem and at most two open at a time. Every merged pull request is a
# production deploy, so a steady stream of small ones costs Netlify credits
# (.claude/engineering-standards.md, section 0). Major versions still arrive
# on their own, so each one is a considered upgrade.
version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: monthly
  open-pull-requests-limit: 2
  labels:
  - ci
  commit-message:
    prefix: 'CI:'
  groups:
    github-actions-minor-and-patch:
      update-types:
      - minor
      - patch
